name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AUTOCONF_WERROR: "0"
      WANT_AUTOCONF_2_5: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential \
            gettext autopoint

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install "pip<24.1"
          pip install "setuptools<=68.2.2" cython==0.29.36 buildozer python-for-android

      - name: Build Android APK with Buildozer
        run: buildozer -v --debug android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-apk
          path: bin/*.apk
