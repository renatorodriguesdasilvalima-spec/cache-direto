name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Update package list
        run: sudo apt-get update

      - name: Install build essentials and Java
        run: sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool pkg-config

      - name: Install development libraries
        run: sudo apt-get install -y zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential gettext autopoint libltdl-dev

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: build android debug
          buildozer_version: master
