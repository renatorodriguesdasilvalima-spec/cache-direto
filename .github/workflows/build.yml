name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y build-essential git ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev autoconf libtool pkg-config zip unzip

    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip
        pip install "pip<24.1"
        pip install cython==0.29.36 buildozer python-for-android

    - name: Clean build environment and compile app
      run: |
        rm -rf .buildozer
        buildozer -v android debug

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-aab-apk
        path: |
          bin/*.aab
          bin/*.apk
