- name: Clean Build Environment & Build App
      run: |
        rm -rf .buildozer
        python -m pip install --upgrade "pip<24.0"
        # Força o sistema a apontar para o Python 3.10 e impede o uso de versões superiores no p4a
        export PATH="/opt/hostedtoolcache/Python/3.10.22/x64/bin:$PATH"
        export PYTHON="/opt/hostedtoolcache/Python/3.10.22/x64/bin/python3"
        yes | buildozer -v android release
