name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Update package list
        run: sudo apt-get update

      - name: Install system dependencies
        run: sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential gettext autopoint libltdl-dev

      - name: Install Buildozer and core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Cython==0.29.36
          pip install buildozer
          pip install python-for-android==2023.5.21

      - name: Build APK with Buildozer
        run: buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cache-direto-apk
          path: bin/*.apk
