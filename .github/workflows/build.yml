name: Build Android App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            libunwind-dev \
            zlib1g-dev \
            libssl-dev \
            libffi-dev \
            libncurses5:i386 \
            libstdc++6:i386 \
            libz1:i386 \
            autoconf \
            libtool \
            pkg-config \
            zip \
            unzip

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install cython==0.29.36 buildozer

    - name: Accept Android SDK Licenses & Build
      run: |
        # Cria a pasta do android sdk se não existir e aceita licenças prévias se necessário
        mkdir -p ~/.buildozer/android/platform/android-sdk
        export PATH=$PATH:/usr/lib/android-sdk/tools/bin
        buildozer -v android release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-aab-apk
        path: |
          bin/*.aab
          bin/*.apk
