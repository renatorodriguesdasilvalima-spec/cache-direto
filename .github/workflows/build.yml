- name: Clean Build Environment & Build App
      run: |
        rm -rf .buildozer
        python -m pip install --upgrade "pip<24.0"
        # Força o p4a/buildozer a usar exatamente o python3.10 do ambiente do GitHub
        export PATH="/opt/hostedtoolcache/Python/3.10.22/x64/bin:$PATH"
        export PYTHON_FOR_ANDROID_PYTHON="/opt/hostedtoolcache/Python/3.10.22/x64/bin/python3"
        yes | buildozer -v android release
