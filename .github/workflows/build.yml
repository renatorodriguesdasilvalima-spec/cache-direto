- name: Install Buildozer, Cython and Compatible Pip
      run: |
        python -m pip install --upgrade pip
        pip install "pip<24.0"
        pip install cython==0.29.36 buildozer

    - name: Clean Build Environment & Build App
      run: |
        rm -rf .buildozer
        # Configura o pip global do sistema para recusar versões acima de 23.3 para evitar que o python-for-android quebre
        mkdir -p ~/.pip
        echo -e "[global]\nno-binary = :all:" > ~/.pip/pip.conf
        yes | buildozer -v android release
